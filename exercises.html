<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Exercises</title>
<style>
  html, body {
    background: #0a0a0a;
    margin: 0; padding: 0;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overscroll-behavior: none;
  }
  body {
    min-height: 100vh;
    padding: 4vw 4vw 8vw;
    box-sizing: border-box;
  }
  h1 {
    font-size: 6.5vw;
    margin: 2vh 0 3vh;
    text-align: center;
    letter-spacing: 1px;
  }
  #grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3.5vw;
  }
  .card {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 3vw 2vw;
    text-align: center;
    color: #fff;
    font-size: 3.8vw;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5vw;
    cursor: pointer;
  }
  .card svg {
    width: 15vw;
    height: 15vw;
  }
  .card.band { border-color: #3d6f9e; }
  .card.band svg { color: #4da3ff; }
  .card.bodyweight { border-color: #3d7a4a; }
  .card.bodyweight svg { color: #4fd47a; }
  .card.dumbbell { border-color: #8a6a2f; }
  .card.dumbbell svg { color: #ffd23f; }

  #detail {
    display: none;
  }
  #detail.open { display: block; }
  #grid.hidden { display: none; }
  h1.hidden { display: none; }

  .back {
    display: inline-block;
    margin-bottom: 3vh;
    color: #ccc;
    font-size: 4.2vw;
    text-decoration: none;
  }
  .detail-icon {
    display: block;
    width: 40vw;
    height: 40vw;
    margin: 0 auto 2vh;
  }
  .detail-icon.band { color: #4da3ff; }
  .detail-icon.bodyweight { color: #4fd47a; }
  .detail-icon.dumbbell { color: #ffd23f; }
  .detail-name {
    font-size: 6.5vw;
    font-weight: 700;
    text-align: center;
    margin-bottom: 3vh;
  }
  .detail-section {
    margin-bottom: 3vh;
  }
  .detail-section h2 {
    font-size: 4vw;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #999;
    margin: 0 0 1vh;
  }
  .detail-section p {
    font-size: 4.6vw;
    line-height: 1.5;
    margin: 0;
  }
  .my-notes {
    width: 100%;
    box-sizing: border-box;
    background: #1a1a1a;
    color: #fff;
    border: 1px solid #333;
    border-radius: 10px;
    font-size: 4.2vw;
    padding: 2vw;
    font-family: inherit;
    resize: vertical;
  }
  .params {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 3vw;
    margin-bottom: 3vh;
  }
  .params .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2vw;
    font-size: 4.2vw;
  }
  .params input[type=number] {
    font-size: 4.2vw;
    width: 3em;
    text-align: center;
    background: #222;
    color: #fff;
    border: 1px solid #555;
    border-radius: 8px;
  }
  .params .hint {
    color: #888;
    font-size: 3.3vw;
    margin-top: 1vh;
  }
  .chk-row {
    display: flex;
    align-items: center;
    gap: 2vw;
    font-size: 4.2vw;
    margin-bottom: 3vh;
  }
  #startBtn {
    display: block;
    width: 100%;
    font-size: 5.5vw;
    padding: 3vw;
    border-radius: 12px;
    border: none;
    background: #2fa84f;
    color: #fff;
    font-weight: 700;
  }
  #speakBtn {
    display: block;
    width: 100%;
    font-size: 4vw;
    padding: 2vw;
    margin-top: 2vh;
    border-radius: 10px;
    border: 1px solid #555;
    background: #1a1a1a;
    color: #ccc;
  }

  #countWrap {
    display: none;
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    z-index: 20;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex-direction: column;
  }
  #countWrap.active { display: flex; }
  #countWrap .back { margin-bottom: 4vh; }
  #cLabel {
    font-size: 10vw;
    letter-spacing: 2px;
    color: #ccc;
    text-transform: uppercase;
    margin-bottom: 2vh;
    font-weight: 600;
  }
  #cBig {
    font-size: min(58vw, 55vh);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    text-shadow: 0 0 30px rgba(255,255,255,0.35);
    transition: transform 0.1s ease-out;
  }
  #cBig.pulse { animation: pulseScale 0.35s ease-out; }
  #cBig.c-done { font-size: min(22vw, 22vh); }
  @keyframes pulseScale {
    0% { transform: scale(1); }
    40% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  #cSub {
    font-size: 9vw;
    color: #ccc;
    margin-top: 3vh;
    font-weight: 500;
  }
  .c-rest { color: #4da3ff; }
  .c-go { color: #fff; }
  .c-done { color: #2fa84f; }
  #cFlash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    z-index: 21;
  }
  #cFlash.rep-flash { background: #fff; animation: repFlash 0.25s ease-out; }
  #cFlash.set-flash { background: #ffd23f; animation: setFlash 0.7s ease-out; }
  @keyframes repFlash { 0% { opacity: 0.45; } 100% { opacity: 0; } }
  @keyframes setFlash { 0% { opacity: 0.65; } 30% { opacity: 0; } 50% { opacity: 0.65; } 100% { opacity: 0; } }
</style>
</head>
<body>

<h1 id="pageTitle">Exercises</h1>
<div id="grid"></div>

<div id="cFlash"></div>
<div id="countWrap">
  <a class="back" href="#" onclick="cancelCount(); return false;">&#10005; Cancel</a>
  <div id="cLabel"></div>
  <div id="cBig"></div>
  <div id="cSub"></div>
</div>

<div id="detail">
  <a class="back" href="#" onclick="showGrid(); return false;">&larr; All exercises</a>
  <svg class="detail-icon" id="detailIcon" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></svg>
  <div class="detail-name" id="detailName"></div>

  <div class="detail-section">
    <h2>Description</h2>
    <p id="detailDescription"></p>
  </div>
  <div class="detail-section">
    <h2>Setup</h2>
    <p id="detailSetup"></p>
  </div>
  <div class="detail-section">
    <h2>Movement</h2>
    <p id="detailMovement"></p>
  </div>
  <div class="detail-section">
    <h2>Tip</h2>
    <p id="detailTip"></p>
  </div>
  <div class="detail-section">
    <h2>Your notes</h2>
    <textarea class="my-notes" id="myNotes" rows="2" placeholder="Add your own cues here..."></textarea>
  </div>

  <div class="params">
    <div class="row"><span>Sets</span><input type="number" id="f-sets"></div>
    <div class="row"><span>Reps</span><input type="number" id="f-reps"></div>
    <div class="row"><span>Seconds / rep</span><input type="number" id="f-seconds"></div>
    <div class="row"><span>Rest (sec)</span><input type="number" id="f-rest"></div>
    <div class="hint">Defaults are placeholders - edit to match what your PT prescribed.</div>
  </div>

  <label class="chk-row"><input type="checkbox" id="f-voice"> Speak aloud during counting</label>

  <button id="speakBtn" onclick="speakDescription()">&#128264; Read description aloud</button>
  <button id="startBtn" onclick="startCounting()">Start Counting</button>
</div>

<script>
// Simple original line-icon parts, reused across exercises.
const DUMBBELL = (cx, cy, angle) => `<g transform="rotate(${angle} ${cx} ${cy})"><line x1="${cx-8}" y1="${cy}" x2="${cx+8}" y2="${cy}"/><circle cx="${cx-8}" cy="${cy}" r="4"/><circle cx="${cx+8}" cy="${cy}" r="4"/></g>`;
const ARROW = '<defs><marker id="__ARROWID__" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>';

  {
    slug: 'hip-abduction',

      <circle cx="55" cy="20" r="8"/>

  {

    setup: 'Anchor the band low in front of you (or loop around both ankles). Face the anchor and hold something stable for balance.',
    movement: 'Keeping your knee straight, extend your working leg backward against the band, squeeze your glute, then return with control.',
    tip: 'Keep your torso upright - avoid arching your lower back to get extra range.',
    defaults: { sets: 2, reps: 10, seconds: 2, rest: 15 },
    icon: `${ARROW}
      <circle cx="55" cy="20" r="8"/>

      <line x1="55" y1="35" x2="68" y2="55"/>
      <line x1="15" y1="90" x2="15" y2="110"/>
      <path d="M15 100 Q35 105 55 65" stroke-dasharray="4 5"/>`
  },
  {
    slug: 'pnf-d2',
    name: 'PNF D2 - Standing',
    type: 'band',
    description: 'A diagonal arm pattern that trains the shoulder and trunk to work together through a full range, mimicking reaching-and-rotating movements.',
    setup: 'Anchor the band low, at your side opposite your working arm. Start with your working hand near your opposite hip, palm facing back.',
    movement: 'Sweep your arm in one smooth diagonal, up and out, finishing overhead and out to the side with your palm turning to face away from you. Reverse slowly to return.',
    tip: 'Move through the whole diagonal smoothly - don’t just raise your arm straight up.',
    defaults: { sets: 2, reps: 10, seconds: 3, rest: 15 },
    icon: `${ARROW}
      <circle cx="55" cy="30" r="8"/>
      <line x1="55" y1="38" x2="55" y2="75"/>

      <path d="M40 75 Q60 60 95 20" marker-end="url(#__ARROWID__)"/>
      <line x1="20" y1="110" x2="40" y2="75" stroke-dasharray="4 5"/>`
  },
  {
    slug: 'bicep-curl',
    name: 'Bicep Curls - Alternating',
    type: 'dumbbell',
    description: 'Strengthens the biceps at the front of the upper arm, used for lifting and carrying.',
    setup: 'Stand or sit holding a dumbbell in each hand, arms at your sides, palms facing forward.',
    movement: 'Curl one dumbbell up toward your shoulder while keeping your elbow tucked at your side, lower with control, then alternate arms.',
    tip: 'Keep your elbow still and close to your body - don’t swing your back or shoulders to help lift.',
    defaults: { sets: 2, reps: 12, seconds: 2, rest: 15 },
    icon: `
      <circle cx="55" cy="20" r="8"/>
      <line x1="55" y1="28" x2="55" y2="65"/>

      <line x1="55" y1="33" x2="70" y2="50"/>
      <line x1="70" y1="50" x2="50" y2="42"/>
      ${DUMBBELL(46, 40, -25)}
      <line x1="55" y1="33" x2="40" y2="60"/>

  {
    slug: 'bridge',
    name: 'Bridge',
    type: 'bodyweight',

    icon: `${ARROW}

      <line x1="58" y1="93" x2="58" y2="76" marker-end="url(#__ARROWID__)"/>`
  },
  {
    slug: 'abdominal-bracing-marches',
    name: 'Abdominal Bracing - Marches',
    type: 'bodyweight',
    description: 'Trains your core to stay braced and your spine to stay steady while your legs move - a foundation for safe lifting and walking.',
    setup: 'Lie on your back, knees bent, feet flat on the floor. Gently brace your abdominals as if about to be poked in the stomach.',
    movement: 'Keeping the brace and your low back still, lift one foot off the floor to a tabletop position, then lower with control and switch legs.',

    defaults: { sets: 2, reps: 10, seconds: 2, rest: 15 },
    icon: `${ARROW}
      <line x1="8" y1="100" x2="115" y2="100" stroke-dasharray="4 5"/>
      <circle cx="15" cy="88" r="8"/>
      <line x1="23" y1="90" x2="55" y2="92"/>
      <line x1="55" y1="92" x2="72" y2="78" stroke-dasharray="3 4"/>
      <line x1="72" y1="78" x2="85" y2="98" stroke-dasharray="3 4"/>
      <line x1="55" y1="92" x2="38" y2="58"/>
      <line x1="38" y1="58" x2="65" y2="58"/>
      <line x1="72" y1="76" x2="42" y2="60" marker-end="url(#__ARROWID__)"/>`
  },
  {
    slug: 'sit-to-stand',
    name: 'Sit to Stand - Arms Crossed',
    type: 'bodyweight',
    description: 'Builds functional leg and core strength for getting up from a chair without using your hands or momentum.',
    setup: 'Sit toward the front edge of a sturdy chair, feet flat on the floor, arms crossed over your chest.',
    movement: 'Lean slightly forward and push through your feet to stand up fully, then lower back down to the chair with control.',
    tip: 'Keep your chest up and avoid rocking or using your arms to help you up.',
    defaults: { sets: 2, reps: 10, seconds: 2, rest: 20 },
    icon: `${ARROW}
      <path d="M25 105 L25 60 L75 60 L75 105" stroke-dasharray="3 4"/>
      <circle cx="60" cy="35" r="8"/>
      <line x1="60" y1="43" x2="60" y2="75"/>
      <line x1="60" y1="75" x2="50" y2="108"/>
      <line x1="60" y1="75" x2="70" y2="108"/>
      <line x1="50" y1="58" x2="70" y2="70"/>
      <line x1="70" y1="58" x2="50" y2="70"/>
      <line x1="60" y1="90" x2="60" y2="72" marker-end="url(#__ARROWID__)"/>`
  },
  {
    slug: 'no-money',
    name: 'No Money - Scapular Retraction',
    type: 'band',
    description: 'Strengthens the mid-back and rotator cuff muscles that support good shoulder posture.',

      <circle cx="60" cy="15" r="7"/>
      <line x1="60" y1="22" x2="60" y2="55"/>
      <line x1="60" y1="55" x2="52" y2="95"/>
      <line x1="60" y1="55" x2="68" y2="95"/>
      <line x1="60" y1="28" x2="46" y2="38"/>
      <line x1="60" y1="28" x2="74" y2="38"/>
      <path d="M46 38 L46 55" stroke-dasharray="3 4"/>
      <path d="M46 38 Q30 45 28 30" marker-end="url(#__ARROWID__)"/>

  {

    defaults: { sets: 2, reps: 10, seconds: 2, rest: 15 },
    icon: `${ARROW}
      <circle cx="60" cy="15" r="7"/>
      <line x1="60" y1="22" x2="60" y2="55"/>
      <line x1="60" y1="55" x2="52" y2="95"/>
      <line x1="60" y1="55" x2="68" y2="95"/>
      <path d="M45 32 L75 32" stroke-dasharray="3 4"/>
      <path d="M60 32 L15 30" marker-end="url(#__ARROWID__)"/>
      <path d="M60 32 L105 30" marker-end="url(#__ARROWID__)"/>`
  },
  {
    slug: 'rows',
    name: 'Rows with Resistance Bands',
    type: 'band',
    description: 'Strengthens the mid-back muscles that pull your shoulder blades together, countering a forward-slumped posture.',

    movement: 'Pull your elbows straight back, squeezing your shoulder blades together and keeping elbows close to your body, then return with control.',

    icon: `${ARROW}
      <circle cx="70" cy="20" r="8"/>

      <line x1="70" y1="65" x2="62" y2="108"/>

      <path d="M70 38 L25 40" stroke-dasharray="3 4"/>

  {
    slug: 'shoulder-extension',

    movement: 'Keeping your elbow straight, pull your arm down and back past your hip against the band, then return with control.',
    tip: 'Keep your torso still and upright - avoid leaning back to generate extra range.',
    defaults: { sets: 2, reps: 10, seconds: 2, rest: 15 },
    icon: `${ARROW}
      <circle cx="55" cy="20" r="8"/>
      <line x1="55" y1="28" x2="55" y2="65"/>
      <line x1="55" y1="65" x2="48" y2="108"/>
      <line x1="55" y1="65" x2="62" y2="108"/>
      <line x1="95" y1="20" x2="95" y2="42"/>
      <line x1="55" y1="35" x2="95" y2="32" stroke-dasharray="3 4"/>
      <path d="M95 32 Q90 65 68 92" marker-end="url(#__ARROWID__)"/>`
  }
];

const gridEl = document.getElementById('grid');
const detailEl = document.getElementById('detail');
const titleEl = document.getElementById('pageTitle');

function resolvedIcon(ex, suffix) {
  // Each icon can define an arrowhead marker; give it a unique id per
  // rendering so duplicate SVG ids on the page don't make icons borrow
  // each other's marker color.
  return ex.icon.replaceAll('__ARROWID__', `arrow-${ex.slug}-${suffix}`);
}

function buildIconSvg(inner) {
  return `<svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

function buildGrid() {
  gridEl.innerHTML = EXERCISES.map(ex => `
    <div class="card ${ex.type}" onclick="openDetail('${ex.slug}')">
      ${buildIconSvg(resolvedIcon(ex, 'card'))}
      <div>${ex.name}</div>
    </div>
  `).join('');
}
buildGrid();

function showGrid() {
  window.speechSynthesis.cancel();
  detailEl.classList.remove('open');
  gridEl.classList.remove('hidden');
  titleEl.classList.remove('hidden');
  history.replaceState(null, '', 'exercises.html');
}

function getSavedVoice() {
  if (!('speechSynthesis' in window)) return null;
  const saved = localStorage.getItem('repcounter_voice');
  if (!saved) return null;
  return window.speechSynthesis.getVoices().find(v => v.voiceURI === saved) || null;
}

let currentExercise = null;

function speakDescription() {
  if (!currentExercise || !('speechSynthesis' in window)) return;
  const ex = currentExercise;
  const text = `${ex.name}. ${ex.description} ${ex.setup} ${ex.movement}`;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = getSavedVoice();
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

function openDetail(slug) {
  const ex = EXERCISES.find(e => e.slug === slug);
  if (!ex) return;
  currentExercise = ex;

  const detailIconEl = document.getElementById('detailIcon');
  detailIconEl.innerHTML = resolvedIcon(ex, 'detail');
  detailIconEl.setAttribute('class', 'detail-icon ' + ex.type);
  document.getElementById('detailName').textContent = ex.name;
  document.getElementById('detailDescription').textContent = ex.description;
  document.getElementById('detailSetup').textContent = ex.setup;
  document.getElementById('detailMovement').textContent = ex.movement;
  document.getElementById('detailTip').textContent = ex.tip;
  document.getElementById('myNotes').value = localStorage.getItem('notes_' + ex.slug) || '';
  document.getElementById('f-sets').value = ex.defaults.sets;
  document.getElementById('f-reps').value = ex.defaults.reps;
  document.getElementById('f-seconds').value = ex.defaults.seconds;
  document.getElementById('f-rest').value = ex.defaults.rest;

  const params = new URLSearchParams(window.location.search);
  const voiceMode = params.get('voice') === '1';
  document.getElementById('f-voice').checked = voiceMode;

  gridEl.classList.add('hidden');
  titleEl.classList.add('hidden');
  detailEl.classList.add('open');
}

document.getElementById('myNotes').addEventListener('input', (e) => {
  if (currentExercise) localStorage.setItem('notes_' + currentExercise.slug, e.target.value);
});

// Keep the screen awake during a voice-guided workout run on this page.
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {
    // unsupported browser, Low Power Mode, etc. - fail silently
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
});

function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

const countWrapEl = document.getElementById('countWrap');
const cLabelEl = document.getElementById('cLabel');
const cBigEl = document.getElementById('cBig');
const cSubEl = document.getElementById('cSub');
const cFlashEl = document.getElementById('cFlash');

function cFlash(type) {
  cFlashEl.className = '';
  void cFlashEl.offsetWidth;
  cFlashEl.className = type === 'set' ? 'set-flash' : 'rep-flash';
}
function cPulse() {
  cBigEl.classList.remove('pulse');
  void cBigEl.offsetWidth;
  cBigEl.classList.add('pulse');
}
const WARM = [255, 91, 61];
const REP_START = [255, 255, 255];
const REST_START = [77, 163, 255];
function lerpColor(start, t) {
  const r = Math.round(start[0] + (WARM[0] - start[0]) * t);
  const g = Math.round(start[1] + (WARM[1] - start[1]) * t);
  const b = Math.round(start[2] + (WARM[2] - start[2]) * t);
  return `rgb(${r}, ${g}, ${b})`;
}
async function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

function speakCount(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = getSavedVoice();
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

let countCancelled = false;
function cancelCount() {
  countCancelled = true;
  window.speechSynthesis.cancel();
  countWrapEl.classList.remove('active');
  detailEl.classList.add('open');
}

async function runCount(sets, reps, seconds, rest, voiceOn) {
  const speakFn = voiceOn ? speakCount : () => {};
  cLabelEl.textContent = '';
  for (let s = 1; s <= sets && !countCancelled; s++) {
    cLabelEl.textContent = `Set ${s} of ${sets}`;
    speakFn(`Set ${s} of ${sets}`);
    for (let r = 1; r <= reps && !countCancelled; r++) {
      cSubEl.textContent = `rep ${r} of ${reps}`;
      speakFn(`Rep ${r}`);
      vibrate(40);
      for (let sec = 1; sec <= seconds && !countCancelled; sec++) {
        cBigEl.textContent = sec;
        cBigEl.className = 'c-go';
        cBigEl.style.color = lerpColor(REP_START, seconds > 1 ? (sec - 1) / (seconds - 1) : 1);
        speakFn(String(sec));
        if (!wakeLock) requestWakeLock();
        await sleep(1000);
      }
      if (countCancelled) return;
      cPulse();
      cFlash('rep');
      vibrate(60);
    }
    if (countCancelled) return;
    cFlash('set');
    vibrate([60, 40, 60]);
    if (s < sets) {
      speakFn('Set complete');
      if (rest > 0) {
        speakFn(`Rest, ${rest} seconds`);
        for (let t = rest; t > 0 && !countCancelled; t--) {
          cLabelEl.textContent = 'Rest';
          cBigEl.textContent = t;
          cBigEl.className = 'c-rest';
          cBigEl.style.color = lerpColor(REST_START, rest > 1 ? (rest - t) / (rest - 1) : 1);
          cSubEl.textContent = `next: set ${s + 1}`;
          if (t <= 3 || t % 5 === 0) speakFn(String(t));
          await sleep(1000);
        }
      }
    }
  }
  if (countCancelled) return;
  cLabelEl.textContent = '';
  cBigEl.textContent = 'Done';
  cBigEl.className = 'c-done';
  cBigEl.style.color = '';
  cSubEl.textContent = '';
  cFlash('set');
  speakFn('Done! Great job.');
  vibrate([100, 50, 100, 50, 200]);
}

function startCounting() {
  const sets = parseInt(document.getElementById('f-sets').value);
  const reps = parseInt(document.getElementById('f-reps').value);
  const seconds = parseInt(document.getElementById('f-seconds').value);
  const rest = parseInt(document.getElementById('f-rest').value) || 0;
  const voiceOn = document.getElementById('f-voice').checked;

  if (!voiceOn) {
    // Silent flow: no speech involved, so handing off to the counter page works fine.
    window.location.href = `index.html?sets=${sets}&reps=${reps}&seconds=${seconds}&rest=${rest}&voice=0`;
    return;
  }

  // Voice flow: stay on THIS page instead of navigating to index.html.
  // The tap on "Start Counting" is what unlocks iOS speech - a navigation
  // to a new page loses that unlock and silently kills the audio, which is
  // exactly the bug that was reported. Speaking the description here first
  // also gives time to get back into position before the counting starts.
  countCancelled = false;
  window.speechSynthesis.cancel();
  detailEl.classList.remove('open');
  countWrapEl.classList.add('active');
  cLabelEl.textContent = 'Get ready...';
  cBigEl.textContent = '';
  cSubEl.textContent = '';
  requestWakeLock();

  const beginCounting = () => runCount(sets, reps, seconds, rest, true);

  if (!('speechSynthesis' in window)) {
    beginCounting();
    return;
  }
  const ex = currentExercise;
  const text = `${ex.name}. ${ex.description} ${ex.setup} ${ex.movement} Get in position now.`;
  const u = new SpeechSynthesisUtterance(text);
  const v = getSavedVoice();
  if (v) u.voice = v;
  u.onend = beginCounting;
  u.onerror = beginCounting;
  window.speechSynthesis.speak(u);
}

// Deep link: exercises.html?ex=bridge&voice=1 opens straight to that
// exercise's description (and speaks it if voice=1), skipping the grid -
// this is what a Siri Shortcut for one specific exercise should point to.
const startParams = new URLSearchParams(window.location.search);
const exParam = startParams.get('ex');
if (exParam && EXERCISES.some(e => e.slug === exParam)) {
  openDetail(exParam);
}
</script>
