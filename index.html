<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Rep Counter</title>
<style>
  html {
    background: #0a0a0a;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0a0a; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
  }
  #wrap {
    text-align: center;
    width: 100%;
  }
  #label {
    font-size: 7vw;
    letter-spacing: 2px;
    color: #ccc;
    text-transform: uppercase;
    margin-bottom: 2vh;
    font-weight: 600;
  }
  #big {
    font-size: min(58vw, 55vh);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    text-shadow: 0 0 30px rgba(255,255,255,0.35);
    -webkit-font-smoothing: antialiased;
  }
  #sub {
    font-size: 6vw;
    color: #ccc;
    margin-top: 3vh;
    font-weight: 500;
  }
  #setup {
    font-size: 5vw;
  }
  #setup input {
    font-size: 5vw;
    width: 3em;
    text-align: center;
    margin: 0.3em;
    background: #222;
    color: #fff;
    border: 1px solid #555;
    border-radius: 8px;
  }
  #setup button {
    font-size: 5vw;
    margin-top: 1em;
    padding: 0.4em 1.2em;
    border-radius: 10px;
    border: none;
    background: #2fa84f;
    color: #fff;
  }
  .rest { color: #4da3ff; }
  .go { color: #fff; }
  .done { color: #2fa84f; }
</style>
</head>
<body>
<div id="bgLayer" style="position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;background-color:#0a0a0a;z-index:-1;"></div>
<div id="wrap">
  <div id="label"></div>
  <div id="big"></div>
  <div id="sub"></div>
</div>

<script>
document.documentElement.style.backgroundColor = '#0a0a0a';
document.body.style.backgroundColor = '#0a0a0a';

// Read params: ?sets=2&reps=10&seconds=8&rest=15
const params = new URLSearchParams(window.location.search);
let sets = parseInt(params.get('sets'));
let reps = parseInt(params.get('reps'));
let seconds = parseInt(params.get('seconds'));
let rest = parseInt(params.get('rest')) || 0; // optional rest between sets, in seconds

const label = document.getElementById('label');
const big = document.getElementById('big');
const sub = document.getElementById('sub');
const wrap = document.getElementById('wrap');

function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

function showSetupForm() {
  wrap.innerHTML = `
    <div id="setup">
      Sets <input type="number" id="s" value="2"><br>
      Reps <input type="number" id="r" value="10"><br>
      Seconds/rep <input type="number" id="d" value="8"><br>
      Rest (sec) <input type="number" id="rt" value="15"><br>
      <button onclick="startFromForm()">Start</button>
    </div>`;
}

function startFromForm() {
  sets = parseInt(document.getElementById('s').value);
  reps = parseInt(document.getElementById('r').value);
  seconds = parseInt(document.getElementById('d').value);
  rest = parseInt(document.getElementById('rt').value) || 0;
  wrap.innerHTML = `<div id="label"></div><div id="big"></div><div id="sub"></div>`;
  run();
}

async function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

async function run() {
  document.getElementById('label').textContent = '';
  for (let s = 1; s <= sets; s++) {
    document.getElementById('label').textContent = `Set ${s} of ${sets}`;
    for (let r = 1; r <= reps; r++) {
      document.getElementById('sub').textContent = `rep ${r} of ${reps}`;
      vibrate(40);
      // Count down (or up) through each second of this rep
      for (let sec = 1; sec <= seconds; sec++) {
        document.getElementById('big').textContent = sec;
        document.getElementById('big').className = 'go';
        await sleep(1000);
      }
    }
    if (s < sets && rest > 0) {
      for (let t = rest; t > 0; t--) {
        document.getElementById('label').textContent = 'Rest';
        document.getElementById('big').textContent = t;
        document.getElementById('big').className = 'rest';
        document.getElementById('sub').textContent = `next: set ${s + 1}`;
        await sleep(1000);
      }
    }
  }
  document.getElementById('label').textContent = '';
  document.getElementById('big').textContent = 'Done';
  document.getElementById('big').className = 'done';
  document.getElementById('sub').textContent = '';
  vibrate([100, 50, 100, 50, 200]);
}

// If URL params are present, auto-start. Otherwise show a manual setup form.
if (sets && reps && seconds) {
  run();
} else {
  showSetupForm();
}
</script>
</body>
</html>
