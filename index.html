<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Rep Counter</title>
<style>
  html {
    background: #0a0a0a;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0a0a; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
  }
  #wrap {
    text-align: center;
    width: 100%;
  }
  #label {
    font-size: 10vw;
    letter-spacing: 2px;
    color: #ccc;
    text-transform: uppercase;
    margin-bottom: 2vh;
    font-weight: 600;
  }
  #big {
    font-size: min(58vw, 55vh);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    text-shadow: 0 0 30px rgba(255,255,255,0.35);
    -webkit-font-smoothing: antialiased;
    transition: transform 0.1s ease-out;
  }
  #big.pulse {
    animation: pulseScale 0.35s ease-out;
  }
  @keyframes pulseScale {
    0% { transform: scale(1); }
    40% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  #sub {
    font-size: 9vw;
    color: #ccc;
    margin-top: 3vh;
    font-weight: 500;
  }
  #setup {
    font-size: 7vw;
    display: none;
  }
  #setup input {
    font-size: 7vw;
    width: 2.5em;
    text-align: center;
    margin: 0.3em;
    background: #222;
    color: #fff;
    border: 1px solid #555;
    border-radius: 8px;
  }
  #setup label.chk {
    display: block;
    font-size: 5.5vw;
    margin-top: 0.8em;
  }
  #setup button {
    font-size: 7vw;
    margin-top: 1em;
    padding: 0.4em 1.2em;
    border-radius: 10px;
    border: none;
    background: #2fa84f;
    color: #fff;
  }
  #setup select {
    font-size: 4.2vw;
    max-width: 80vw;
    margin-top: 0.6em;
    background: #222;
    color: #fff;
    border: 1px solid #555;
    border-radius: 8px;
    padding: 0.3em;
  }
  #testVoiceBtn {
    font-size: 4.2vw;
    background: #4da3ff;
    padding: 0.3em 0.9em;
    margin-left: 0.5em;
  }
  .rest { color: #4da3ff; }
  .go { color: #fff; }
  .done { color: #2fa84f; }

  #flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    z-index: 10;
  }
  #flash.rep-flash {
    background: #ffffff;
    animation: repFlash 0.25s ease-out;
  }
  #flash.set-flash {
    background: #ffd23f;
    animation: setFlash 0.7s ease-out;
  }
  @keyframes repFlash {
    0% { opacity: 0.45; }
    100% { opacity: 0; }
  }
  @keyframes setFlash {
    0% { opacity: 0.65; }
    30% { opacity: 0; }
    50% { opacity: 0.65; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<div id="bgLayer" style="position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;background-color:#0a0a0a;z-index:-1;"></div>
<div id="flash"></div>
<div id="wrap">
  <div id="label"></div>
  <div id="big"></div>
  <div id="sub"></div>
  <div id="setup">
    Sets <input type="number" id="s" value="2"><br>
    Reps <input type="number" id="r" value="10"><br>
    Seconds/rep <input type="number" id="d" value="8"><br>
    Rest (sec) <input type="number" id="rt" value="15"><br>
    <label class="chk"><input type="checkbox" id="v"> Speak aloud</label>
    <select id="vn"></select>
    <button type="button" id="testVoiceBtn" onclick="previewVoice()">Test voice</button><br>
    <button onclick="startFromForm()">Start</button>
  </div>
</div>

<script>
document.documentElement.style.backgroundColor = '#0a0a0a';
document.body.style.backgroundColor = '#0a0a0a';

// Read params: ?sets=2&reps=10&seconds=8&rest=15&voice=1
const params = new URLSearchParams(window.location.search);
let sets = parseInt(params.get('sets'));
let reps = parseInt(params.get('reps'));
let seconds = parseInt(params.get('seconds'));
let rest = parseInt(params.get('rest')) || 0; // optional rest between sets, in seconds
// A page can't detect it was opened by Siri, so voice mode is driven by this
// flag instead: a Siri Shortcut includes &voice=1, a tapped bookmark/icon doesn't.
let voiceMode = params.get('voice') === '1';

const label = document.getElementById('label');
const big = document.getElementById('big');
const sub = document.getElementById('sub');
const wrap = document.getElementById('wrap');
const flashEl = document.getElementById('flash');

// Keep the screen from dimming/locking while this page is open.
// Re-requested on visibility changes and on the Start tap (a user gesture),
// since some browsers only honor the request right after user interaction,
// and the lock can be silently dropped (e.g. app briefly backgrounded).
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {
    // unsupported browser, Low Power Mode, etc. - fail silently
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
});
window.addEventListener('load', requestWakeLock);
requestWakeLock();

function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

// Voice picker: this changes which text-to-speech voice reads the counting
// out loud - it can't change Siri's own voice, that's a separate iOS setting.
let voices = [];
let selectedVoice = null;
const voiceSelectEl = document.getElementById('vn');

function loadVoices() {
  const all = window.speechSynthesis.getVoices();
  voices = all.filter(v => v.lang.startsWith('en'));
  if (voices.length === 0) voices = all;
  if (voices.length === 0) return;
  voiceSelectEl.innerHTML = voices.map(v =>
    `<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`
  ).join('');
  const saved = localStorage.getItem('repcounter_voice');
  if (saved && voices.some(v => v.voiceURI === saved)) {
    voiceSelectEl.value = saved;
  }
  updateSelectedVoice();
}

function updateSelectedVoice() {
  selectedVoice = voices.find(v => v.voiceURI === voiceSelectEl.value) || null;
}

function previewVoice() {
  updateSelectedVoice();
  if (selectedVoice) localStorage.setItem('repcounter_voice', selectedVoice.voiceURI);
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance('One, two, three');
  if (selectedVoice) u.voice = selectedVoice;
  window.speechSynthesis.speak(u);
}

if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text) {
  if (!voiceMode || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel(); // drop anything queued so audio can't fall behind
  const u = new SpeechSynthesisUtterance(text);
  if (selectedVoice) u.voice = selectedVoice;
  window.speechSynthesis.speak(u);
}

function flash(type) {
  flashEl.className = '';
  void flashEl.offsetWidth; // force reflow so the animation restarts
  flashEl.className = type === 'set' ? 'set-flash' : 'rep-flash';
}

function pulseBig() {
  big.classList.remove('pulse');
  void big.offsetWidth;
  big.classList.add('pulse');
}

// The big number progresses from a cool color to a warm one as a rep or a
// rest period runs out, so progress is visible at a glance, not just at the
// instant of a flash. Reps start white, rest starts blue, both end at the
// same warm red-orange "wrapping up" color.
const WARM = [255, 91, 61];
const REP_START = [255, 255, 255];
const REST_START = [77, 163, 255];
function lerpColor(start, t) {
  const r = Math.round(start[0] + (WARM[0] - start[0]) * t);
  const g = Math.round(start[1] + (WARM[1] - start[1]) * t);
  const b = Math.round(start[2] + (WARM[2] - start[2]) * t);
  return `rgb(${r}, ${g}, ${b})`;
}

const setupEl = document.getElementById('setup');

function showSetupForm() {
  setupEl.style.display = 'block';
}

function startFromForm() {
  sets = parseInt(document.getElementById('s').value);
  reps = parseInt(document.getElementById('r').value);
  seconds = parseInt(document.getElementById('d').value);
  rest = parseInt(document.getElementById('rt').value) || 0;
  voiceMode = document.getElementById('v').checked;
  updateSelectedVoice();
  if (selectedVoice) localStorage.setItem('repcounter_voice', selectedVoice.voiceURI);
  setupEl.style.display = 'none';
  requestWakeLock(); // re-request from this tap, since it's a direct user gesture
  run();
}

async function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

async function run() {
  label.textContent = '';
  for (let s = 1; s <= sets; s++) {
    label.textContent = `Set ${s} of ${sets}`;
    speak(`Set ${s} of ${sets}`);
    for (let r = 1; r <= reps; r++) {
      sub.textContent = `rep ${r} of ${reps}`;
      speak(`Rep ${r}`);
      vibrate(40);
      // Count through each second of this rep, visually and (in voice mode) aloud
      for (let sec = 1; sec <= seconds; sec++) {
        big.textContent = sec;
        big.className = 'go';
        big.style.color = lerpColor(REP_START, seconds > 1 ? (sec - 1) / (seconds - 1) : 1);
        speak(String(sec));
        if (!wakeLock) requestWakeLock(); // heartbeat: recover a silently-dropped lock
        await sleep(1000);
      }
      // Make the rep boundary obvious even if you're not watching closely
      pulseBig();
      flash('rep');
      vibrate(60);
    }
    // Set boundary gets a bigger flash + a distinct vibration pattern
    flash('set');
    vibrate([60, 40, 60]);
    if (s < sets) {
      speak('Set complete');
      if (rest > 0) {
        speak(`Rest, ${rest} seconds`);
        for (let t = rest; t > 0; t--) {
          label.textContent = 'Rest';
          big.textContent = t;
          big.className = 'rest';
          big.style.color = lerpColor(REST_START, rest > 1 ? (rest - t) / (rest - 1) : 1);
          sub.textContent = `next: set ${s + 1}`;
          if (t <= 3 || t % 5 === 0) speak(String(t));
          await sleep(1000);
        }
      }
    }
  }
  label.textContent = '';
  big.textContent = 'Done';
  big.className = 'done';
  big.style.color = '';
  sub.textContent = '';
  flash('set');
  speak('Done! Great job.');
  vibrate([100, 50, 100, 50, 200]);
}

// If URL params are present, auto-start. Otherwise show a manual setup form.
if (sets && reps && seconds) {
  run();
} else {
  showSetupForm();
}
</script>
</body>
</html>
